<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>文章检索 - 化妆品行业洞察</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F5F5DC; --surface: #FFFFFF; --ink: #211D19; --muted: #8A8178;
            --accent: #C8102E; --accent-hover: #9E0E23; --gold: #D4AF37; --border: #EAE2D6;
            --serif: 'Noto Serif SC', Georgia, 'Songti SC', 'SimSun', serif;
            --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--sans); background: var(--bg); height: 100vh; display: flex; color: var(--ink); }
        .sidebar { width: 280px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .sidebar-header { padding: 22px 20px 18px; border-bottom: 1px solid var(--border); }
        .sidebar-header h1 { font-family: var(--serif); font-size: 19px; font-weight: 700; margin-bottom: 6px; }
        .sidebar-header h1 em { color: var(--accent); font-style: normal; }
        .sidebar-header .homelink { font-size: 12px; color: var(--accent); text-decoration: none; }
        .sidebar-header .stats { margin-top: 12px; padding: 12px; background: var(--bg); border-radius: 8px; font-size: 13px; color: var(--muted); }
        .sidebar-header .stats div { margin: 4px 0; }
        .sidebar-search { padding: 12px 16px; border-bottom: 1px solid var(--border); }
        .sidebar-search input { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; transition: all 0.2s; background: var(--bg); }
        .sidebar-search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(166,25,46,0.08); background: #fff; }
        .source-list { flex: 1; overflow-y: auto; padding: 10px; }
        .source-item { padding: 11px 14px; margin: 3px 0; border-radius: 8px; cursor: pointer; transition: all 0.2s; display: flex; justify-content: space-between; align-items: center; }
        .source-item:hover { background: #F5EFE6; }
        .source-item.active { background: #FBE9EB; border-left: 3px solid var(--accent); }
        .source-item.hidden { display: none; }
        .source-name { font-size: 14px; font-weight: 500; }
        .source-count { font-size: 12px; color: var(--muted); background: var(--bg); padding: 2px 8px; border-radius: 10px; }
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .main-header { background: var(--surface); padding: 18px 30px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .main-header h2 { font-family: var(--serif); font-size: 20px; font-weight: 700; }
        .main-header .actions { display: flex; gap: 10px; align-items: center; }
        .btn { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); background: #fff; cursor: pointer; font-size: 14px; transition: all 0.2s; }
        .btn:hover { border-color: var(--accent); color: var(--accent); }
        .btn-success { background: var(--accent); color: #fff; border-color: var(--accent); }
        .btn-success:hover { background: var(--accent-hover); color: #fff; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .mode-switch { font-size: 13px; color: var(--muted); }
        .filter-bar { background: var(--surface); padding: 12px 30px; border-bottom: 1px solid var(--border); display: flex; gap: 10px; align-items: center; }
        .filter-bar label { font-size: 14px; color: var(--muted); }
        .filter-bar select, .filter-bar input[type="date"] { padding: 7px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; cursor: pointer; background: #fff; }
        .filter-bar select:focus, .filter-bar input[type="date"]:focus { border-color: var(--accent); }
        .filter-bar .filter-info { font-size: 13px; color: var(--muted); margin-left: 10px; }
        .article-list { flex: 1; overflow-y: auto; padding: 24px 30px; background-image: radial-gradient(rgba(200,16,46,0.04) 1px, transparent 1.6px); background-size: 24px 24px; }
        .list-toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; font-size: 13px; color: var(--muted); }
        .list-toolbar label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .article-card { background: var(--surface); border-radius: 14px; border: 1px solid var(--border); overflow: hidden; transition: all .4s cubic-bezier(.34,1.4,.5,1); position: relative; display: flex; flex-direction: column; box-shadow: 0 1px 1px rgba(0,0,0,0.05), 0 4px 6px rgba(34,42,53,0.04), 0 24px 68px rgba(47,48,55,0.05), 0 2px 3px rgba(0,0,0,0.04); }
        .article-card:hover { transform: translateY(-5px); box-shadow: 0 1px 1px rgba(0,0,0,0.05), 0 8px 12px rgba(34,42,53,0.08), 0 32px 80px rgba(47,48,55,0.12), 0 2px 3px rgba(0,0,0,0.06); }
        .article-card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(166,25,46,0.25); }
        .card-check { position: absolute; top: 10px; left: 10px; z-index: 2; width: 22px; height: 22px; cursor: pointer; accent-color: var(--accent); }
        .card-cover { width: 100%; height: 150px; object-fit: cover; display: block; background: #F0EAE0; }
        .cover-fallback { width: 100%; height: 110px; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #3D1A22, #5A1F2B); color: var(--gold); font-family: var(--serif); font-size: 34px; font-weight: 700; }
        .card-body { padding: 16px 18px 18px; display: flex; flex-direction: column; flex: 1; }
        .card-title { font-size: 15px; font-weight: 600; line-height: 1.55; margin-bottom: 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card-title a { color: var(--ink); text-decoration: none; }
        .card-title a:hover { color: var(--accent); }
        .card-summary { font-size: 12.5px; color: var(--muted); line-height: 1.7; margin-bottom: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; flex: 1; }
        .card-meta { display: flex; justify-content: space-between; align-items: center; }
        .card-date { font-size: 12px; color: var(--muted); }
        .source-badge { font-size: 11px; color: var(--accent); background: #FBE9EB; padding: 3px 10px; border-radius: 10px; }
        .empty-state { text-align: center; padding: 100px 20px; color: var(--muted); }
        .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
        .loading { text-align: center; padding: 60px; color: var(--muted); }
        .footer { background: var(--surface); padding: 12px 30px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
        .export-info { font-size: 13px; color: var(--muted); margin-right: 6px; }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: #333; color: #fff; padding: 12px 24px; border-radius: 8px; font-size: 14px; display: flex; align-items: center; gap: 8px; opacity: 0; transition: all 0.3s; z-index: 1000; }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        .toast.error { background: #ff4d4f; }
        .toast.success { background: #52c41a; }
        /* 卡片交错入场（anime.js stagger） */
        @keyframes cardIn { from { opacity: 0; transform: translateY(20px) scale(.97); } to { opacity: 1; transform: none; } }
        .card-grid .article-card { animation: cardIn .55s cubic-bezier(.34,1.45,.5,1) both; }
        .card-grid .article-card:nth-child(1) { animation-delay: .02s; }
        .card-grid .article-card:nth-child(2) { animation-delay: .06s; }
        .card-grid .article-card:nth-child(3) { animation-delay: .10s; }
        .card-grid .article-card:nth-child(4) { animation-delay: .14s; }
        .card-grid .article-card:nth-child(5) { animation-delay: .18s; }
        .card-grid .article-card:nth-child(6) { animation-delay: .22s; }
        .card-grid .article-card:nth-child(7) { animation-delay: .26s; }
        .card-grid .article-card:nth-child(8) { animation-delay: .30s; }
        .card-grid .article-card:nth-child(n+9) { animation-delay: .34s; }
        @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h1>化妆品<em>文章检索</em></h1>
            <a class="homelink" href="index.html">← 返回首页</a>
            <div class="stats" id="stats"><div>加载中...</div></div>
        </div>
        <div class="sidebar-search">
            <input type="text" id="sourceSearch" placeholder="搜索公众号..." oninput="filterSources()">
        </div>
        <div class="source-list" id="sourceList"></div>
    </div>
    <div class="main-content">
        <div class="main-header">
            <h2 id="pageTitle">请选择公众号</h2>
            <div class="actions">
                <div class="mode-switch">
                    <span id="updateInfo">数据更新: 加载中...</span>
                </div>
                <button class="btn" onclick="refreshData()">刷新数据</button>
                <span class="export-info" id="exportInfo"></span>
                <button class="btn btn-success" id="exportBtn" onclick="exportSelected()" disabled>导出选中</button>
            </div>
        </div>
        <div class="filter-bar" id="filterBar" style="display:none;">
            <label>时间筛选：</label>
            <select id="timeFilter" onchange="filterByTime()">
                <option value="all">全部时间</option>
                <option value="3">最近3天</option>
                <option value="7">最近7天</option>
                <option value="15">最近15天</option>
                <option value="30">最近30天</option>
                <option value="custom">自定义范围...</option>
            </select>
            <div id="customDateRange" style="display:none; margin-left:10px;">
                <input type="date" id="startDate" onchange="filterByTime()">
                <span style="margin:0 5px;">至</span>
                <input type="date" id="endDate" onchange="filterByTime()">
            </div>
            <span class="filter-info" id="filterInfo"></span>
        </div>
        <div class="article-list" id="articleList">
            <div class="empty-state"><div class="icon">📚</div><div>请在左侧选择公众号查看文章</div></div>
        </div>
        <div class="footer">
            <span>数据库最后更新: <span id="lastUpdate">-</span></span>
            <span>可选择文章导出</span>
        </div>
    </div>
    <div class="toast" id="toast">
        <span class="toast-icon" id="toastIcon"></span>
        <span class="toast-message" id="toastMessage"></span>
    </div>
    <script>
        var ARTICLE_DATA = null;
        var currentSource = null, allArticles = [], filteredArticles = [];
        var selectedArticles = new Map();

        function init() { loadData(); }

        function loadData() {
            document.getElementById('stats').innerHTML = '<div>加载数据中...</div>';
            var cacheBuster = Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            fetch('data.v72.json?t=' + cacheBuster, {
                cache: 'no-store',
                headers: { 'Cache-Control': 'no-cache, no-store, must-revalidate', 'Pragma': 'no-cache' }
            })
                .then(function(response) {
                    if (!response.ok) throw new Error('加载失败');
                    return response.json();
                })
                .then(function(data) {
                    ARTICLE_DATA = data;
                    renderStats();
                    renderSources();
                    if (data.stats && data.stats.last_update) {
                        var updateTime = new Date(data.stats.last_update);
                        document.getElementById('updateInfo').textContent =
                            '数据更新: ' + updateTime.toLocaleString('zh-CN') + ' (共' + data.stats.total_articles + '篇)';
                    }
                })
                .catch(function(error) {
                    console.error('加载数据失败:', error);
                    document.getElementById('stats').innerHTML = '<div style="color:#ff4d4f">数据加载失败</div>';
                    showToast('数据加载失败，请刷新重试', 'error');
                });
        }

        function showToast(message, type) {
            var toast = document.getElementById('toast');
            toast.className = 'toast show ' + (type || 'success');
            document.getElementById('toastIcon').textContent = type === 'error' ? '❌' : '✅';
            document.getElementById('toastMessage').textContent = message;
            setTimeout(function() { toast.classList.remove('show'); }, 3000);
        }

        function renderStats() {
            if (!ARTICLE_DATA || !ARTICLE_DATA.stats) return;
            var stats = ARTICLE_DATA.stats;
            document.getElementById('stats').innerHTML =
                '<div>总文章数: ' + stats.total_articles + '</div>' +
                '<div>公众号数: ' + stats.source_count + '</div>' +
                '<div>日期范围: ' + stats.date_range.start + ' ~ ' + stats.date_range.end + '</div>';
            document.getElementById('lastUpdate').textContent = new Date().toLocaleString('zh-CN');
        }

        function renderSources() {
            if (!ARTICLE_DATA || !ARTICLE_DATA.sources) return;
            document.getElementById('sourceList').innerHTML = ARTICLE_DATA.sources.map(function(s) {
                return '<div class="source-item" data-source="' + s.name + '" onclick="selectSource(\'' + s.name + '\')">' +
                    '<span class="source-name">' + s.name + '</span><span class="source-count">' + s.count + '篇</span>' +
                    '</div>';
            }).join('');
        }

        function filterSources() {
            var keyword = document.getElementById('sourceSearch').value.toLowerCase();
            document.querySelectorAll('.source-item').forEach(function(item) {
                var name = item.querySelector('.source-name').textContent.toLowerCase();
                item.classList.toggle('hidden', name.indexOf(keyword) < 0);
            });
        }

        function selectSource(sourceName) {
            currentSource = sourceName;
            document.querySelectorAll('.source-item').forEach(function(item) {
                item.classList.toggle('active', item.dataset.source === sourceName);
            });
            document.getElementById('pageTitle').textContent = sourceName + ' 的所有文章';
            document.getElementById('articleList').innerHTML = '<div class="loading">加载中...</div>';
            document.getElementById('filterBar').style.display = 'flex';
            setTimeout(function() {
                allArticles = (ARTICLE_DATA && ARTICLE_DATA.articles) ? (ARTICLE_DATA.articles[sourceName] || []) : [];
                document.getElementById('timeFilter').value = 'all';
                filterByTime();
            }, 300);
        }

        function filterByTime() {
            var filterType = document.getElementById('timeFilter').value;
            var now = new Date(); now.setHours(0, 0, 0, 0);
            var customRange = document.getElementById('customDateRange');
            customRange.style.display = filterType === 'custom' ? 'flex' : 'none';

            if (filterType === 'all') {
                filteredArticles = allArticles.slice();
                document.getElementById('filterInfo').textContent = '';
            } else if (filterType === 'custom') {
                var startDateStr = document.getElementById('startDate').value;
                var endDateStr = document.getElementById('endDate').value;
                if (!startDateStr || !endDateStr) {
                    filteredArticles = allArticles.slice();
                    document.getElementById('filterInfo').textContent = '请选择开始和结束日期';
                } else {
                    var startDate = new Date(startDateStr);
                    var endDate = new Date(endDateStr); endDate.setHours(23, 59, 59, 999);
                    filteredArticles = allArticles.filter(function(a) {
                        var d = new Date(a.publish_date);
                        return d >= startDate && d <= endDate;
                    });
                    document.getElementById('filterInfo').textContent =
                        '（' + startDateStr + ' 至 ' + endDateStr + '，显示 ' + filteredArticles.length + ' / ' + allArticles.length + ' 篇）';
                }
            } else {
                var cutoffDate = new Date(now);
                cutoffDate.setDate(cutoffDate.getDate() - parseInt(filterType));
                filteredArticles = allArticles.filter(function(a) {
                    var d = new Date(a.publish_date); d.setHours(0, 0, 0, 0);
                    return d >= cutoffDate;
                });
                document.getElementById('filterInfo').textContent =
                    '（显示 ' + filteredArticles.length + ' / ' + allArticles.length + ' 篇）';
            }

            filteredArticles.sort(function(a, b) {
                return new Date(b.publish_date || '1970-01-01') - new Date(a.publish_date || '1970-01-01');
            });
            renderArticles(filteredArticles);
        }

        function escHtml(s) {
            return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function cleanSummary(s) {
            var t = String(s || '').replace(/&nbsp;/g, ' ').replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim();
            return t.length > 70 ? t.slice(0, 70) + '…' : t;
        }

        function renderArticles(articles) {
            if (!articles.length) {
                document.getElementById('articleList').innerHTML = '<div class="empty-state"><div class="icon">📭</div><div>该时间段暂无文章</div></div>';
                return;
            }
            var currentSelectedCount = 0;
            for (var i = 0; i < articles.length; i++) {
                if (isSelected(currentSource, i)) currentSelectedCount++;
            }
            var allSelected = currentSelectedCount === articles.length && articles.length > 0;

            var html = '<div class="list-toolbar"><label><input type="checkbox" class="card-check-input" id="selectAll" ' +
                (allSelected ? 'checked' : '') + ' onchange="toggleSelectAll()"> 全选本页</label>' +
                '<span>共 ' + articles.length + ' 篇</span></div><div class="card-grid">';

            html += articles.map(function(a, i) {
                var selected = isSelected(currentSource, i);
                var cover = a.cover
                    ? '<img class="card-cover" src="' + a.cover + '" loading="lazy" onerror="this.outerHTML=fallbackCover(\'' + encodeURIComponent(a.source || '') + '\')">'
                    : fallbackCover(encodeURIComponent(a.source || ''));
                return '<div class="article-card' + (selected ? ' selected' : '') + '" id="row-' + i + '">' +
                    '<input type="checkbox" class="card-check" id="cb-' + i + '" ' + (selected ? 'checked' : '') + ' onchange="toggleArticle(' + i + ')">' +
                    cover +
                    '<div class="card-body">' +
                        '<div class="card-title"><a href="' + a.url + '" target="_blank">' + escHtml(a.title) + '</a></div>' +
                        '<div class="card-summary">' + escHtml(cleanSummary(a.summary)) + '</div>' +
                        '<div class="card-meta"><span class="card-date">' + escHtml(a.publish_date) + '</span>' +
                        '<span class="source-badge">' + escHtml(a.source) + '</span></div>' +
                    '</div></div>';
            }).join('');
            html += '</div>';
            document.getElementById('articleList').innerHTML = html;
            updateExportButton();
        }

        function fallbackCover(sourceEnc) {
            var name = decodeURIComponent(sourceEnc || '');
            var initial = name ? name.charAt(0) : '文';
            return '<div class="cover-fallback">' + escHtml(initial) + '</div>';
        }

        function isSelected(source, index) { return selectedArticles.has(source + '_' + index); }

        function setSelected(source, index, selected) {
            var key = source + '_' + index;
            if (selected) {
                selectedArticles.set(key, { source: source, index: index, article: filteredArticles[index] });
            } else {
                selectedArticles.delete(key);
            }
        }

        function toggleSelectAll() {
            var selectAllCheckbox = document.getElementById('selectAll');
            var currentSelectedCount = 0;
            for (var i = 0; i < filteredArticles.length; i++) {
                if (isSelected(currentSource, i)) currentSelectedCount++;
            }
            var allSelected = currentSelectedCount === filteredArticles.length && filteredArticles.length > 0;
            for (var j = 0; j < filteredArticles.length; j++) {
                setSelected(currentSource, j, !allSelected);
            }
            if (selectAllCheckbox) selectAllCheckbox.checked = !allSelected;
            renderArticles(filteredArticles);
            updateExportButton();
        }

        function toggleArticle(index) {
            var currentlySelected = isSelected(currentSource, index);
            setSelected(currentSource, index, !currentlySelected);
            var card = document.getElementById('row-' + index);
            if (card) card.classList.toggle('selected', !currentlySelected);
            var cb = document.getElementById('cb-' + index);
            if (cb) cb.checked = !currentlySelected;
            var currentSelectedCount = 0;
            for (var i = 0; i < filteredArticles.length; i++) {
                if (isSelected(currentSource, i)) currentSelectedCount++;
            }
            var selectAllCheckbox = document.getElementById('selectAll');
            if (selectAllCheckbox) {
                selectAllCheckbox.checked = currentSelectedCount === filteredArticles.length && filteredArticles.length > 0;
            }
            updateExportButton();
        }

        function updateExportButton() {
            var btn = document.getElementById('exportBtn');
            var totalSelected = selectedArticles.size;
            btn.disabled = !totalSelected;
            document.getElementById('exportInfo').textContent = totalSelected ? '已选择 ' + totalSelected + ' 篇' : '';
        }

        function exportSelected() {
            if (!selectedArticles.size) { showToast('请先选择要导出的文章', 'error'); return; }
            var selectedData = [];
            selectedArticles.forEach(function(item) {
                selectedData.push({ source: item.source, title: item.article.title, publish_date: item.article.publish_date, url: item.article.url });
            });
            var csv = '﻿公众号名称,文章名称,时间,链接\n';
            selectedData.forEach(function(a) {
                csv += '"' + a.source + '","' + a.title + '","' + a.publish_date + '","' + a.url + '"\n';
            });
            var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'articles_multi_' + new Date().toISOString().slice(0, 10) + '.csv';
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('成功导出 ' + selectedArticles.size + ' 篇文章');
        }

        function refreshData() {
            selectedArticles.clear();
            updateExportButton();
            ARTICLE_DATA = null; allArticles = []; filteredArticles = [];
            var src = currentSource; currentSource = null;
            loadData();
            if (src) setTimeout(function() { selectSource(src); }, 600);
            showToast('数据已刷新');
        }

        init();
    </script>
</body>
</html>
