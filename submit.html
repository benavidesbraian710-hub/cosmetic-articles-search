<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>提交需求 - 化妆品行业洞察</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700;900&display=swap" rel="stylesheet">
    <style>
        h1, h2, .logo { font-family: 'Noto Serif SC', Georgia, 'Songti SC', serif; }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; background: #F5F5DC; min-height: 100vh; }
        .topbar { background: #fff; border-bottom: 1px solid #EAE2D6; padding: 0 40px; height: 64px; display: flex; align-items: center; justify-content: space-between; }
        .topbar .logo { font-size: 18px; font-weight: 600; color: #333; }
        .topbar .logo span { color: #C8102E; }
        .topbar a.back { font-size: 14px; color: #C8102E; text-decoration: none; }
        .container { max-width: 640px; margin: 48px auto; padding: 0 20px; }
        .panel { background: #fff; border-radius: 12px; box-shadow: 0 1px 1px rgba(0,0,0,0.05), 0 4px 6px rgba(34,42,53,0.04), 0 24px 68px rgba(47,48,55,0.05), 0 2px 3px rgba(0,0,0,0.04); padding: 40px; }
        .panel h1 { font-size: 24px; color: #333; margin-bottom: 8px; }
        .panel .desc { font-size: 14px; color: #666; margin-bottom: 28px; line-height: 1.7; }
        .field { margin-bottom: 20px; }
        .field label { display: block; font-size: 14px; color: #333; font-weight: 500; margin-bottom: 8px; }
        .field label .req { color: #ff4d4f; }
        .field input, .field select, .field textarea { width: 100%; padding: 10px 12px; border: 1px solid #E0D6C6; border-radius: 6px; font-size: 14px; outline: none; transition: all .35s cubic-bezier(.34,1.56,.64,1); font-family: inherit; }
        .field input:focus, .field select:focus, .field textarea:focus { border-color: #C8102E; box-shadow: 0 0 0 2px rgba(166,25,46,0.08); }
        .field textarea { resize: vertical; min-height: 100px; }
        .field .hint { font-size: 12px; color: #999; margin-top: 6px; }
        .btn-submit { width: 100%; padding: 12px; background: #C8102E; color: #fff; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; transition: background .3s; }
        .btn-submit:hover { background: #9E0E23; }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
        .msg { margin-top: 16px; padding: 12px 16px; border-radius: 6px; font-size: 14px; display: none; }
        .msg.ok { display: block; background: #f6ffed; border: 1px solid #b7eb8f; color: #389e0d; }
        .msg.err { display: block; background: #fff2f0; border: 1px solid #ffccc7; color: #cf1322; }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="logo">化妆品行业<span>洞察平台</span></div>
        <a class="back" href="index.html">← 返回首页</a>
    </div>
    <div class="container">
        <div class="panel">
            <h1>📮 提交收录需求</h1>
            <div class="desc">希望我们收录某个公众号或网站？填写以下信息并留下您的联系方式，我们会评估并与您确认。</div>
            <form id="reqForm">
                <div class="field">
                    <label>需求类型 <span class="req">*</span></label>
                    <select id="reqType" required>
                        <option value="add_wechat">收录公众号</option>
                        <option value="add_website">收录网站</option>
                        <option value="other">其他需求</option>
                    </select>
                </div>
                <div class="field" id="sourceNameField">
                    <label>来源名称 <span class="req">*</span></label>
                    <input type="text" id="sourceName" placeholder="例如：某某公众号 / 某某网站" required>
                </div>
                <div class="field" id="sourceUrlField">
                    <label>来源链接</label>
                    <input type="url" id="sourceUrl" placeholder="https://...（如有）">
                </div>
                <div class="field">
                    <label>需求说明</label>
                    <textarea id="detail" placeholder="补充说明您希望收录的内容范围、更新频率等"></textarea>
                </div>
                <div class="field">
                    <label>您的称呼 <span class="req">*</span></label>
                    <input type="text" id="contactName" placeholder="怎么称呼您" required>
                </div>
                <div class="field">
                    <label>联系邮箱 <span class="req">*</span></label>
                    <input type="email" id="contactEmail" placeholder="name@example.com" required>
                    <div class="hint">仅用于我们就该需求与您联系，不会用于其他用途。</div>
                </div>
                <button type="submit" class="btn-submit" id="submitBtn">提交需求</button>
                <div class="msg" id="msg"></div>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        // 选「其他需求」时隐藏来源名称/链接字段
        document.getElementById('reqType').addEventListener('change', function() {
            const isOther = this.value === 'other';
            document.getElementById('sourceNameField').style.display = isOther ? 'none' : '';
            document.getElementById('sourceUrlField').style.display = isOther ? 'none' : '';
            document.getElementById('sourceName').required = !isOther;
        });

        document.getElementById('reqForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const msg = document.getElementById('msg');
            btn.disabled = true; btn.textContent = '提交中...';
            const payload = {
                type: document.getElementById('reqType').value,
                source_name: document.getElementById('sourceName').value.trim() || null,
                source_url: document.getElementById('sourceUrl').value.trim() || null,
                description: document.getElementById('detail').value.trim() || null,
                name: document.getElementById('contactName').value.trim(),
                email: document.getElementById('contactEmail').value.trim(),
            };
            try {
                const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                const { error } = await sb.from('requests').insert(payload);
                if (error) throw error;
                msg.className = 'msg ok';
                msg.textContent = '✅ 提交成功！我们会尽快评估并通过邮箱与您联系。';
                document.getElementById('reqForm').reset();
            } catch (err) {
                msg.className = 'msg err';
                msg.textContent = '❌ 提交失败：服务暂未上线，请稍后重试。';
            }
            btn.disabled = false; btn.textContent = '提交需求';
        });
    </script>
</body>
</html>
